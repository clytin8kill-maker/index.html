
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050b16">
<title>HOLO AI PROGRAMER</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#050b16;color:#e9fbff;font-family:Arial,sans-serif}
header{text-align:center;padding:22px 10px;border-bottom:1px solid #087d9b}
h1{color:#42eaff;letter-spacing:3px;font-size:23px;margin:5px}
header p{color:#8dbbc9;font-size:12px}
main{padding:14px;max-width:750px;margin:auto}
.panel{background:#0a1727;border:1px solid #12617b;border-radius:13px;padding:14px;margin-bottom:14px}
h2{font-size:15px;color:#42eaff;margin-top:0}
input,button,select{width:100%;padding:13px;margin:5px 0;border-radius:8px;border:1px solid #17617c;background:#07111e;color:white;font-size:14px}
button{background:#063d55;color:#65efff;font-weight:bold}
button:active{background:#087b9b}
#scene{height:280px;background:radial-gradient(circle,#102c42,#030812);border:1px solid #087d9b;border-radius:12px;overflow:hidden}
#scene canvas{display:block;width:100%;height:100%}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.status{font-size:12px;color:#8ed9e9;margin-top:10px}
footer{text-align:center;color:#547d8a;font-size:11px;padding:15px}
</style>
</head>
<body>
<header>
<h1>HOLO AI PROGRAMER</h1>
<p>ESTÚDIO HOLOGRÁFICO DE CRIAÇÃO 3D</p>
</header>
<main>
<section class="panel">
<h2>01 / DESCREVA SEU PROJETO</h2>
<input id="prompt" placeholder="Ex.: Crie uma casa futurista">
<button onclick="createObject()">GERAR PROJETO DEMONSTRATIVO</button>
<button onclick="listen()">ATIVAR COMANDO DE VOZ</button>
<div class="status" id="status">Sistema aguardando comando.</div>
</section>

<section class="panel">
<h2>02 / VISUALIZAÇÃO 3D</h2>
<div id="scene"></div>
<div class="controls">
<button onclick="rotate(-1)">GIRAR ESQUERDA</button>
<button onclick="rotate(1)">GIRAR DIREITA</button>
<button onclick="zoom(1)">APROXIMAR</button>
<button onclick="zoom(-1)">AFASTAR</button>
</div>
</section>

<section class="panel">
<h2>03 / PERSONALIZAR PROJETO</h2>
<select id="color" onchange="changeColor()">
<option value="#20eaff">Azul holográfico</option>
<option value="#00ff88">Verde tecnológico</option>
<option value="#ffb52e">Dourado</option>
<option value="#d65cff">Roxo</option>
</select>
<div class="controls">
<button onclick="createShape('cube')">CUBO</button>
<button onclick="createShape('sphere')">ESFERA</button>
<button onclick="createShape('cone')">CONE</button>
<button onclick="createShape('torus')">ANEL 3D</button>
</div>
</section>

<section class="panel">
<h2>04 / INFORMAÇÕES</h2>
<p id="info">Nenhum projeto selecionado.</p>
<button onclick="saveProject()">SALVAR DESCRIÇÃO</button>
</section>
</main>
<footer>HOLO AI PROGRAMER · PROTÓTIPO 01</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
let scene,camera,renderer,object;
let rotation=0,scale=1;
const status=document.getElementById("status");

function init(){
scene=new THREE.Scene();
camera=new THREE.PerspectiveCamera(65,1,0.1,100);
camera.position.set(0,1.5,5);
renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.getElementById("scene").appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff,0.8));
let light=new THREE.PointLight(0x20ddff,2);
light.position.set(3,4,5);scene.add(light);
let grid=new THREE.GridHelper(10,20,0x087d9b,0x123344);
scene.add(grid);
createShape("cube");
resize();
animate();
}
function resize(){
let el=document.getElementById("scene");
camera.aspect=el.clientWidth/el.clientHeight;
camera.updateProjectionMatrix();
renderer.setSize(el.clientWidth,el.clientHeight);
}
function createShape(type){
if(object){scene.remove(object);object.geometry.dispose();object.material.dispose();}
let geometry;
if(type==="sphere")geometry=new THREE.SphereGeometry(1,32,24);
else if(type==="cone")geometry=new THREE.ConeGeometry(1,1.8,32);
else if(type==="torus")geometry=new THREE.TorusGeometry(0.8,0.25,16,80);
else geometry=new THREE.BoxGeometry(1.5,1.5,1.5);
let material=new THREE.MeshStandardMaterial({
color:document.getElementById("color").value,
metalness:0.65,roughness:0.22,wireframe:false
});
object=new THREE.Mesh(geometry,material);
scene.add(object);
rotation=0;scale=1;
object.scale.setScalar(scale);
document.getElementById("info").textContent="Objeto 3D: "+type;
status.textContent="Objeto demonstrativo criado.";
}
function animate(){
requestAnimationFrame(animate);
if(object){object.rotation.y+=0.008;object.rotation.x+=0.003;}
renderer.render(scene,camera);
}
function rotate(direction){if(object)object.rotation.y+=direction*0.4;}
function zoom(direction){
if(!object)return;
scale=Math.max(0.5,Math.min(2.5,scale+direction*0.15));
object.scale.setScalar(scale);
}
function changeColor(){
if(object)object.material.color.set(document.getElementById("color").value);
}
function createObject(){
let p=document.getElementById("prompt").value.toLowerCase();
if(!p.trim()){status.textContent="Descreva seu projeto primeiro.";return;}
let type="cube";
if(p.includes("esfera")||p.includes("bola"))type="sphere";
else if(p.includes("cone"))type="cone";
else if(p.includes("anel")||p.includes("aro"))type="torus";
else if(p.includes("casa")||p.includes("máquina")||p.includes("carro"))type="cube";
createShape(type);
document.getElementById("info").textContent=
"Descrição: "+document.getElementById("prompt").value+
" | Representação 3D demonstrativa.";
}
function listen(){
const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!Speech){status.textContent="Reconhecimento de voz não suportado neste navegador.";return;}
let recognition=new Speech();
recognition.lang="pt-BR";
recognition.onstart=()=>status.textContent="Ouvindo...";
recognition.onresult=(e)=>{
let command=e.results[0][0].transcript.toLowerCase();
document.getElementById("prompt").value=command;
if(command.includes("girar"))rotate(1);
else if(command.includes("aproximar"))zoom(1);
else if(command.includes("afastar"))zoom(-1);
else createObject();
};
recognition.onerror=()=>status.textContent="Não foi possível reconhecer a voz.";
recognition.start();
}
function saveProject(){
let data=document.getElementById("prompt").value;
if(!data.trim()){status.textContent="Digite uma descrição antes de salvar.";return;}
localStorage.setItem("holo_project",data);
status.textContent="Descrição salva neste navegador.";
}
window.addEventListener("resize",resize);
init();
</script>
</body>
</html>
